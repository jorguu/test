<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Josh Salon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" id="favicon" href="img/logo.jpg">
</head>
<body>

  <header class="header" id="header">
    <div class="container header__inner">
      <a href="#top" class="brand">
        <img class="brand__logo" id="brand-logo" src="" alt="">
        <span class="brand__name" id="brand-name"></span>
      </a>
      <nav class="nav" id="nav" aria-label="Hauptnavigation">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>
      <a class="btn btn--small" id="nav-cta" href="#"></a>
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menü öffnen">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="container hero__inner">
        <div class="hero__text">
          <p class="status" id="status"><span class="status__dot"></span><span id="status-text"></span></p>
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 class="hero__title" id="hero-title"></h1>
          <p class="hero__subtitle" id="hero-subtitle"></p>
          <div class="hero__actions">
            <a class="btn" id="hero-cta" href="#"></a>
            <a class="btn btn--ghost" id="hero-cta2" href="#"></a>
          </div>
        </div>
        <div class="hero__visual">
          <img class="hero__logo" id="hero-logo" src="" alt="">
        </div>
      </div>
    </section>

    <section class="section" id="leistungen">
      <div class="container">
        <p class="eyebrow" id="services-eyebrow"></p>
        <h2 class="section__title" id="services-title"></h2>
        <div class="services" id="services-list"></div>
      </div>
    </section>

    <section class="section section--alt" id="ueber-uns">
      <div class="container about">
        <div>
          <p class="eyebrow" id="about-eyebrow"></p>
          <h2 class="section__title" id="about-title"></h2>
        </div>
        <div>
          <p class="about__text" id="about-text"></p>
          <p class="about__langs"><span id="about-langs-label"></span> <span id="about-langs"></span></p>
        </div>
      </div>
    </section>

    <section class="section" id="zeiten">
      <div class="container split">
        <div>
          <p class="eyebrow" id="hours-eyebrow"></p>
          <h2 class="section__title" id="hours-title"></h2>
        </div>
        <ul class="hours" id="hours-list"></ul>
      </div>
    </section>

    <section class="section section--dark" id="kontakt">
      <div class="container contact">
        <div class="contact__info">
          <p class="eyebrow" id="contact-eyebrow"></p>
          <h2 class="section__title" id="contact-title"></h2>
          <address class="contact__address" id="contact-address"></address>
          <ul class="contact__links" id="contact-links"></ul>
          <a class="btn" id="contact-directions" href="#" target="_blank" rel="noopener"></a>
        </div>
        <div class="contact__map">
          <iframe id="contact-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span id="footer-year"></span> <span id="footer-text"></span></span>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
